name: pulso-orders

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso_orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies committed migrations and seeds the demo merchant.
  migrate:
    build:
      context: .
      target: build
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    environment:
      DATABASE_URL: postgresql://pulso:pulso@postgres:5432/pulso_orders?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      PERSISTENCE: prisma
      DATABASE_URL: postgresql://pulso:pulso@postgres:5432/pulso_orders?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      JWT_ISSUER: pulso-orders-api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
