name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall generates the Prisma client; no database is needed.
      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --ci

      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: pulso-orders-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: test "$(docker image inspect pulso-orders-api:ci --format '{{.Config.User}}')" = "node"
